<body>

    <header>

        <div class="card">

            <h2>Login</h2>

            <form>

            </form>

            <p style="text-align:center;">
                Don't have an account?
                <a href="registration.html">Register Here</a>
            </p>

        </div>

    </main>

        © 2026 FreshMart Online Grocery Store
    </footer>
